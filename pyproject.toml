[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-intelligence"
version = "0.1.0"
description = "Read-only, evidence-based GitHub reporting POC"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "PyJWT[crypto]>=2.10,<3", "psycopg[binary]>=3.2,<4"]

[project.scripts]
github-intelligence = "github_intelligence.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src/github_intelligence"]
