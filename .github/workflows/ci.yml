name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Quality Checks and Unit Tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Python unit tests
        run: uv run pytest tests/unit

      - name: Run JavaScript tests
        run: node --test "tests/js/*.test.cjs"

      - name: Run Ruff linter and formatter check
        run: uv run ruff check src tests scripts

      - name: Run mypy static type analysis
        run: uv run mypy

  integration-tests:
    name: Native PostgreSQL Integration Tests
    runs-on: windows-latest
    env:
      GHI_PG_BIN: ${{ runner.temp }}/pgsql-17.11-5/pgsql/bin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache PostgreSQL 17 binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pgsql-17.11-5
          key: postgresql-windows-${{ hashFiles('scripts/db/prepare_test_postgres.py') }}

      - name: Prepare native PostgreSQL 17
        run: uv run python scripts/db/prepare_test_postgres.py --cache "${{ runner.temp }}/pgsql-17.11-5"

      - name: Run Python integration tests
        run: uv run pytest tests/integration
