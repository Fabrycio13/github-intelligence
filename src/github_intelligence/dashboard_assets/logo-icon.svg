<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Outer Head Contour / Ears -->
  <path d="M64 36 L46 38 L26 22 L24 54 L18 72 L28 92 L44 104 L64 112 L84 104 L100 92 L110 72 L104 54 L102 22 L82 38 Z" 
        stroke="#38bdf8" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Inner Ear Facets -->
  <path d="M32 36 L28 58 L44 48 Z" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M96 36 L100 58 L84 48 Z" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Feline Tech Eyes -->
  <polygon points="36,64 50,62 44,70" fill="#38bdf8"/>
  <polygon points="92,64 78,62 84,70" fill="#38bdf8"/>

  <!-- Git Commit Topology Branches -->
  <line x1="64" y1="36" x2="64" y2="52" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="46" y2="80" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="82" y2="80" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="80" x2="64" y2="98" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="82" y1="80" x2="64" y2="98" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="98" x2="64" y2="112" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers / Branch Terminals -->
  <line x1="32" y1="78" x2="10" y2="76" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="34" y1="86" x2="14" y2="90" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="96" y1="78" x2="118" y2="76" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="94" y1="86" x2="114" y2="90" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Muzzle Point -->
  <polygon points="64,74 61,70 67,70" fill="#38bdf8"/>

  <!-- Commit Nodes -->
  <!-- Crown Node -->
  <circle cx="64" cy="36" r="4.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="64" cy="36" r="2.2" fill="#38bdf8"/>

  <!-- Split Node -->
  <circle cx="64" cy="52" r="4.5" fill="#0d1117" stroke="#10b981" stroke-width="2"/>
  <circle cx="64" cy="52" r="2.2" fill="#10b981"/>

  <!-- Left Branch Node -->
  <circle cx="46" cy="80" r="4.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="46" cy="80" r="2.2" fill="#38bdf8"/>

  <!-- Right Branch Node -->
  <circle cx="82" cy="80" r="4.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="82" cy="80" r="2.2" fill="#38bdf8"/>

  <!-- Merge Node -->
  <circle cx="64" cy="98" r="4.5" fill="#0d1117" stroke="#10b981" stroke-width="2"/>
  <circle cx="64" cy="98" r="2.2" fill="#10b981"/>

  <!-- Base Node -->
  <circle cx="64" cy="112" r="3.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="64" cy="112" r="1.8" fill="#38bdf8"/>
</svg>
